[package]
name = "agent-hub-observer"
version = "0.3.17"
edition = "2024"
rust-version = "1.98.1"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "fs", "io-util", "net", "process", "sync", "time"] }
rustix = { version = "=1.1.5", features = ["process"] }
rmcp = { version = "=3.9.0", default-features = false, features = ["client", "transport-child-process"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
