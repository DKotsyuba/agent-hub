<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <!-- Cover the device viewport, resize for the keyboard where supported, and keep native-style fixed scaling. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="color-scheme" content="light dark" />
  <!-- Match browser chrome to the light and dark canvases. -->
  <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#141c29" media="(prefers-color-scheme: dark)" />
  <!-- Opt into standalone launch and supply the iOS Home Screen title. -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Hub" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- An opaque status bar: iOS 26 sizes a black-translucent standalone web view one status-bar height short of the screen bottom. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <!-- Keep numeric data from becoming automatic phone links. -->
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Agent Hub — обзор экосистемы</title>
</head>
<body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
