name: Release

# Publishes the Linux x86-64 Hub distribution when a vX.Y.Z tag is pushed. The desktop (Tauri) application is
# parked and not released; the standalone build supports Linux x64 (glibc) only, so there is no macOS asset.
# Configure required reviewers on the `release` environment; this file alone does not do it.
# See RELEASING.md.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  check:
    name: Source and integration gate
    uses: ./.github/workflows/ci.yml

  # Builds the payload independently of the source gate and without any release credentials; publishing needs both.
  build:
    name: Build Linux x86_64 payload
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare private temporary directories
        run: |
          umask 077
          test -n "${RUNNER_TEMP:-}"
          runner_temporary="$(realpath "$RUNNER_TEMP")"
          task_root="$runner_temporary/agent-hub-release"
          export TMPDIR="$task_root/tmp" TMP="$task_root/tmp" TEMP="$task_root/tmp"
          export npm_config_cache="$task_root/npm-cache" BUN_INSTALL_CACHE_DIR="$task_root/bun-cache"
          export XDG_CACHE_HOME="$task_root/cache" CARGO_HOME="$task_root/cargo"
          mkdir -m 0700 -p "$task_root" "$TMPDIR" "$npm_config_cache" "$BUN_INSTALL_CACHE_DIR" "$XDG_CACHE_HOME" "$CARGO_HOME"
          test "$(uname -s):$(uname -m)" = Linux:x86_64
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\nnpm_config_cache=%s\nBUN_INSTALL_CACHE_DIR=%s\nXDG_CACHE_HOME=%s\nCARGO_HOME=%s\n' \
            "$TMPDIR" "$TMP" "$TEMP" "$npm_config_cache" "$BUN_INSTALL_CACHE_DIR" "$XDG_CACHE_HOME" "$CARGO_HOME" >> "$GITHUB_ENV"
          printf 'FORBIDDEN_RUNNER_TEMP=%s\n' "$runner_temporary" >> "$GITHUB_ENV"

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "26.13.0"
          architecture: x64
          check-latest: false
          package-manager-cache: false

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
          no-cache: true

      - name: Install the pinned Rust toolchain
        run: |
          test "$(bun --version)" = 1.4.4
          rustup toolchain install 1.98.1 --profile minimal --no-self-update
          test "$(rustc --version | awk '{print $2}')" = 1.98.1

      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Fetch locked native observer dependencies
        run: cargo fetch --locked --manifest-path server/observer/Cargo.toml

      - name: Build, verify and smoke-test the archive to publish
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/release.mjs check "$version"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          npm run build:release -- "$RUNNER_TEMP/payload"
          node scripts/release.mjs verify "$version" "$RUNNER_TEMP/payload" --forbid "$FORBIDDEN_RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/rel"
          tar -xzf "$RUNNER_TEMP/payload/agent-hub-$version-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/rel"
          python3 scripts/smoke-release.py "$RUNNER_TEMP/rel/agent-hub-$version-linux-x86_64"

      - name: Upload the exact payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: payload
          path: ${{ runner.temp }}/payload/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attest and publish
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the tagged source for the release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: payload
          path: ${{ runner.temp }}/payload

      - name: Verify hashes before attesting
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd "$RUNNER_TEMP/payload"
          sha256sum --check SHA256SUMS
          test "$(ls | wc -l)" = 2
          test -f "agent-hub-$version-linux-x86_64.tar.gz"
          node "$GITHUB_WORKSPACE/scripts/release.mjs" notes "$version" > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"

      - name: Attest the exact release inventory
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/payload/SHA256SUMS

      - name: Stage a draft, verify the uploaded assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          cd "$RUNNER_TEMP/payload"
          gh release create "$tag" --draft --verify-tag --title "Agent Hub ${tag#v}" --notes-file "$RUNNER_TEMP/notes.md" \
            "agent-hub-${tag#v}-linux-x86_64.tar.gz" SHA256SUMS
          fresh="$RUNNER_TEMP/fresh"
          mkdir "$fresh"
          gh release download "$tag" --dir "$fresh"
          (cd "$fresh" && sha256sum --check SHA256SUMS)
          gh attestation verify "$fresh/agent-hub-${tag#v}-linux-x86_64.tar.gz" --repo "$GITHUB_REPOSITORY"
          gh release edit "$tag" --draft=false
